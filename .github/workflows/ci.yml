name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            templates/nextjs/package-lock.json

      - name: Install Astro dependencies
        run: npm ci

      - name: Check Astro target
        run: npm run check

      - name: Install retained Next.js dependencies
        run: npm ci --prefix templates/nextjs

      - name: Check retained Next.js target
        run: npm run check:nextjs
