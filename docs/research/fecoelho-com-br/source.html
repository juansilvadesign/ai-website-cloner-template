  <style>
    :root {
      --bg: #faf8f5;
      --bg-elev: #ffffff;
      --bg-soft: #f2eee8;
      --ink: #191410;
      --ink-soft: #4a423b;
      --ink-mute: #8a7f74;
      --line: #e6ddd2;
      --accent: #d1553b;
      --accent-2: #6b4bd6;
      --accent-ink: #ffffff;
      --shadow: 0 1px 2px rgba(25, 20, 16, .04), 0 12px 32px rgba(25, 20, 16, .08);
      --shadow-sm: 0 1px 2px rgba(25, 20, 16, .05), 0 6px 16px rgba(25, 20, 16, .06);
      --radius: 18px;
      --font-sans: "Inter", system-ui, -apple-system, sans-serif;
      --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0c0b;
        --bg-elev: #1a1614;
        --bg-soft: #201b18;
        --ink: #f4efe9;
        --ink-soft: #c9bfb4;
        --ink-mute: #8f8478;
        --line: #2c2622;
        --accent: #f0714f;
        --accent-2: #9c85f0;
        --accent-ink: #17110d;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.45);
        --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-sans);
      background:
        radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
        var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
    }
    a { color: inherit; text-decoration: none; }

    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    /* Avatar */
    .avatar-wrap {
      width: 132px;
      height: 132px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: var(--shadow);
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 50%;
      background: var(--bg-soft);
      display: block;
      border: 3px solid var(--bg-elev);
    }

    .name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.85rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .role {
      margin-top: 8px;
      color: var(--ink-soft);
      font-size: 1rem;
      font-weight: 500;
    }
    .role .dot { color: var(--accent); font-weight: 700; }
    .tagline {
      margin-top: 4px;
      color: var(--ink-mute);
      font-size: .9rem;
    }

    /* Links */
    .links {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 18px;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
      font-size: 1.02rem;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .link:active { transform: scale(.985); }
    @media (hover: hover) {
      .link:hover { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
    }
    .link .ico {
      flex: 0 0 40px;
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 12px;
      background: var(--bg-soft);
      color: var(--accent);
    }
    .link .ico svg { width: 21px; height: 21px; display: block; }
    .link .txt { flex: 1; text-align: left; }
    .link .sub {
      display: block;
      font-weight: 400;
      font-size: .8rem;
      color: var(--ink-mute);
      margin-top: 1px;
    }
    .link .arr { color: var(--ink-mute); flex: 0 0 auto; }

    /* Primary save-contact button */
    .link.primary {
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, var(--accent-2)));
      color: var(--accent-ink);
      border-color: transparent;
    }
    .link.primary .ico { background: rgba(255,255,255,.18); color: var(--accent-ink); }
    .link.primary .sub { color: color-mix(in srgb, var(--accent-ink) 82%, transparent); }
    .link.primary .arr { color: color-mix(in srgb, var(--accent-ink) 75%, transparent); }

    .foot {
      margin-top: 26px;
      font-size: .82rem;
      color: var(--ink-mute);
    }
    .foot a { color: var(--accent); font-weight: 600; }
  </style>
</head>
