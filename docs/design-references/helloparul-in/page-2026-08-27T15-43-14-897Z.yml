    - generic [ref=f2e325]:
      - heading "Key Learning" [level=2] [ref=f2e326]
      - paragraph [ref=f2e327]: One of the biggest learnings from this project was understanding how solving one business problem can unintentionally create another.
      - paragraph [ref=f2e328]: Increasing review participation successfully improved trust across the platform, but it also introduced information overload.
      - paragraph [ref=f2e329]: The real UX challenge wasn't simply adding more content.
      - paragraph [ref=f2e330]: It was helping users consume the right information faster and with less effort.
