<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:var(--section-y-desktop) var(--container-gutter-desktop);background:var(--bg);color:var(--surface);font-family:var(--font-body)}.line{display:flex;align-items:center;gap:var(--space-4);margin-block:var(--space-4)}.bar{height:20px;background:var(--accent)}</style></head><body><h1>Evidence-shaped spacing</h1><div class="line"><span>4</span><div class="bar" style="width:var(--space-1)"></div></div><div class="line"><span>12</span><div class="bar" style="width:var(--space-3)"></div></div><div class="line"><span>32</span><div class="bar" style="width:var(--space-8)"></div></div><div class="line"><span>48</span><div class="bar" style="width:var(--space-12)"></div></div></body></html>
