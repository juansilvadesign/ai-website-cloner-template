<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Colors</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:32px;background:var(--bg);color:var(--surface);font-family:var(--font-body)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.swatch{min-height:140px;padding:16px;color:var(--fg);background:var(--surface)}.dark{color:var(--surface);background:var(--bg)}.accent{background:var(--accent)}.muted{background:var(--muted)}</style></head><body><h1>Marcos Arruda color roles</h1><div class="grid"><div class="swatch dark">--bg</div><div class="swatch">--surface</div><div class="swatch accent">--accent</div><div class="swatch muted">--muted</div></div></body></html>
