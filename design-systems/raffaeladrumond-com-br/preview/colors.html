<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" /><title>Raffaela Drumond — Colors</title><link rel="stylesheet" href="../tokens.css" /><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.swatch{min-height:150px;padding:16px;border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--surface);display:flex;align-items:end;font-weight:500}.bg{background:var(--bg)}.surface{background:var(--surface)}.warm{background:var(--surface-warm)}.ink{background:var(--fg);color:var(--surface)}.sage{background:var(--muted);color:var(--surface)}.accent{background:var(--accent);color:var(--accent-on)}</style></head><body><h1>Color roles</h1><div class="grid"><div class="swatch bg">Canvas — #F9F9F9</div><div class="swatch surface">Surface — #FFFFFF</div><div class="swatch warm">Warm — #FFF8F2</div><div class="swatch ink">Ink — #3C4128</div><div class="swatch sage">Sage — #7D8264</div><div class="swatch accent">CTA — #8C916E</div></div></body></html>
