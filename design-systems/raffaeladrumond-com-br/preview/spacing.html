<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" /><title>Raffaela Drumond — Spacing</title><link rel="stylesheet" href="../tokens.css" /><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}.row{display:flex;align-items:center;gap:16px;margin-block:12px}.bar{height:20px;border-radius:var(--radius-pill);background:var(--accent)}.s1{width:var(--space-1)}.s2{width:var(--space-2)}.s3{width:var(--space-3)}.s4{width:var(--space-4)}.s5{width:var(--space-5)}.s6{width:var(--space-6)}.s8{width:var(--space-8)}.s12{width:var(--space-12)}.panel{margin-top:32px;padding:var(--space-8);border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}</style></head><body><h1>Spacing scale</h1><div class="row"><span>4</span><i class="bar s1"></i></div><div class="row"><span>8</span><i class="bar s2"></i></div><div class="row"><span>12</span><i class="bar s3"></i></div><div class="row"><span>16</span><i class="bar s4"></i></div><div class="row"><span>20</span><i class="bar s5"></i></div><div class="row"><span>24</span><i class="bar s6"></i></div><div class="row"><span>32</span><i class="bar s8"></i></div><div class="row"><span>48</span><i class="bar s12"></i></div><div class="panel">Featured container uses 32px insets and 20px corners.</div></body></html>
