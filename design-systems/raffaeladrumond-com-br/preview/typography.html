<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" /><title>Raffaela Drumond — Typography</title><link rel="stylesheet" href="../tokens.css" /><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}p{max-width:68ch;font-size:var(--text-lg);line-height:var(--leading-body)}.xs{font-size:var(--text-xs)}.sm{font-size:var(--text-sm)}.display{margin:0;font-family:var(--font-display);font-weight:300;line-height:var(--leading-tight)}.d4{font-size:var(--text-4xl)}.d3{font-size:var(--text-3xl);color:var(--muted)}.d2{font-size:var(--text-2xl)}</style></head><body><p class="xs">Poppins 11px — metadata and service details</p><p class="sm">Poppins 13px — uppercase eyebrow labels</p><p>Dermatologia estética com critério médico. Resultados consistentes. Sem excessos.</p><h1 class="display d4">Beleza natural com <em>elegância</em></h1><h2 class="display d3">Critério é o que sustenta resultados.</h2><h3 class="display d2">Manchas e qualidade da pele</h3></body></html>
