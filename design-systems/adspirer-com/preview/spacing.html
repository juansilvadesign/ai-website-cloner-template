<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adspirer spacing</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}main{max-width:960px;margin:auto}.rows{display:grid;gap:var(--space-6)}.row{display:grid;grid-template-columns:100px 1fr;gap:var(--space-4);align-items:center}.bar{height:18px;background:var(--accent);border-radius:var(--radius-pill)}.section-demo{margin-top:var(--section-y-phone);padding:var(--space-8);border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--surface)}@media(min-width:992px){.section-demo{margin-top:var(--section-y-desktop)}}</style></head><body><main><h1>Spacing rhythm</h1><div class="rows"><div class="row"><span>4px</span><i class="bar" style="width:var(--space-1)"></i></div><div class="row"><span>16px</span><i class="bar" style="width:var(--space-4)"></i></div><div class="row"><span>24px</span><i class="bar" style="width:var(--space-6)"></i></div><div class="row"><span>48px</span><i class="bar" style="width:var(--space-12)"></i></div></div><section class="section-demo">Sections retain generous pauses instead of collapsing into a dense SaaS dashboard.</section></main></body></html>
