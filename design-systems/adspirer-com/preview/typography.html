<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adspirer typography</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}main{max-width:1000px;margin:auto}.eyebrow{font-size:var(--text-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}h1,h2{font-family:var(--font-display);line-height:var(--leading-tight);letter-spacing:var(--tracking-display);margin:.2em 0}.display{font-size:clamp(40px,9vw,var(--text-4xl))}.section{font-size:var(--text-3xl)}p{max-width:60ch;line-height:var(--leading-body)}code{font-family:var(--font-mono);background:var(--surface);padding:4px 8px;border-radius:var(--radius-sm)}</style></head><body><main><p class="eyebrow">Paid media, handled</p><h1 class="display">AI agents that run your paid media.</h1><h2 class="section">Less advice. More account work.</h2><p>Inter remains practical and readable for support copy, setup instructions, plan descriptions, and navigation. Display type stays confidently tight without turning into a visual effect.</p><code>mcp.adspirer.com</code></main></body></html>
