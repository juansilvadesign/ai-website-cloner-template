<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adspirer colors</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}main{max-width:960px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}.swatch{min-height:150px;padding:16px;border:1px solid var(--border-soft);border-radius:var(--radius-md);display:flex;align-items:end;font-weight:700}.bg{background:var(--bg)}.surface{background:var(--surface)}.ink{background:var(--fg);color:var(--accent-on)}.muted{background:var(--muted);color:var(--accent-on)}.accent{background:var(--accent);color:var(--accent-on)}.warm{background:var(--surface-warm)}h1{font-family:var(--font-display);letter-spacing:var(--tracking-display)}</style></head><body><main><p>Adspirer / color roles</p><h1>Quiet canvas. Clear action.</h1><div class="grid"><div class="swatch bg">Canvas</div><div class="swatch surface">Surface</div><div class="swatch ink">Primary ink</div><div class="swatch muted">Muted copy</div><div class="swatch accent">Primary blue</div><div class="swatch warm">Inset gray</div></div></main></body></html>
