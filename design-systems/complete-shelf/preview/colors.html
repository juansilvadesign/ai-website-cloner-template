<!-- The Complete Shelf — color reference -->
<link rel="stylesheet" href="../tokens.css" />
<style>
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body);
    padding: var(--space-8); margin: 0; }
  h1 { font-family: var(--font-display); font-size: var(--text-3xl);
    line-height: var(--leading-tight); letter-spacing: var(--tracking-display); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: var(--space-4); }
  .swatch { background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); overflow: hidden; }
  .chip { height: 88px; }
  .copy { padding: var(--space-3); }
  code { color: var(--muted); font-family: var(--font-mono); font-size: var(--text-base); }
</style>
<h1>Paper, ink, and signal</h1>
<div class="grid">
  <article class="swatch"><div class="chip" style="background:var(--bg)"></div><div class="copy"><code>--bg</code><br />Cream paper</div></article>
  <article class="swatch"><div class="chip" style="background:var(--surface)"></div><div class="copy"><code>--surface</code><br />Light paper</div></article>
  <article class="swatch"><div class="chip" style="background:var(--surface-warm)"></div><div class="copy"><code>--surface-warm</code><br />Deep paper</div></article>
  <article class="swatch"><div class="chip" style="background:var(--fg)"></div><div class="copy"><code>--fg</code><br />Primary ink</div></article>
  <article class="swatch"><div class="chip" style="background:var(--muted)"></div><div class="copy"><code>--muted</code><br />Secondary ink</div></article>
  <article class="swatch"><div class="chip" style="background:var(--border)"></div><div class="copy"><code>--border</code><br />Hairline</div></article>
  <article class="swatch"><div class="chip" style="background:var(--accent)"></div><div class="copy"><code>--accent</code><br />Terracotta</div></article>
  <article class="swatch"><div class="chip" style="background:var(--success)"></div><div class="copy"><code>--success</code><br />Ready status</div></article>
</div>
