<!-- The Complete Shelf — spacing and motion reference -->
<link rel="stylesheet" href="../tokens.css" />
<style>
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body);
    padding: var(--space-8); margin: 0; }
  h1 { font-family: var(--font-display); font-size: var(--text-3xl);
    line-height: var(--leading-tight); letter-spacing: var(--tracking-display); }
  .row { display: flex; align-items: center; gap: var(--space-4);
    border-top: 1px solid var(--border-soft); padding: var(--space-3) 0; }
  code { width: 180px; color: var(--meta); font: var(--text-base) var(--font-mono); }
  .bar { height: 18px; background: var(--accent); }
  .control { width: 50px; height: 50px; border: 1px solid var(--border);
    border-radius: var(--radius-pill); background: var(--surface); }
</style>
<h1>Quiet structural rhythm</h1>
<div class="row"><code>--space-1 · 4px</code><i class="bar" style="width:var(--space-1)"></i></div>
<div class="row"><code>--space-2 · 8px</code><i class="bar" style="width:var(--space-2)"></i></div>
<div class="row"><code>--space-3 · 12px</code><i class="bar" style="width:var(--space-3)"></i></div>
<div class="row"><code>--space-4 · 16px</code><i class="bar" style="width:var(--space-4)"></i></div>
<div class="row"><code>--space-5 · 20px</code><i class="bar" style="width:var(--space-5)"></i></div>
<div class="row"><code>--space-6 · 24px</code><i class="bar" style="width:var(--space-6)"></i></div>
<div class="row"><code>--space-8 · 32px</code><i class="bar" style="width:var(--space-8)"></i></div>
<div class="row"><code>--space-12 · 48px</code><i class="bar" style="width:var(--space-12)"></i></div>
<div class="row"><code>control form</code><button class="control" aria-label="Control example"></button></div>
<div class="row"><code>--motion-fast</code><span>220ms micro-state</span></div>
<div class="row"><code>--motion-base</code><span>520ms focus handoff</span></div>
