<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Consulta de Processos — Colors</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}.swatch{min-height:120px;padding:16px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}.teal{background:var(--accent);color:var(--accent-on)}.soft{background:var(--surface-warm)}.ink{background:var(--fg);color:var(--accent-on)}</style></head><body><main><div class="swatch">Surface</div><div class="swatch soft">Soft slate</div><div class="swatch teal">Teal accent</div><div class="swatch ink">Slate ink</div></main></body></html>
