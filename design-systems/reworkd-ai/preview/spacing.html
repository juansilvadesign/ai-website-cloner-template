<!doctype html><html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../tokens.css" /><style>body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding:var(--space-12)}.row{align-items:center;display:flex;gap:var(--space-4);margin:var(--space-4) 0}.bar{background:linear-gradient(90deg,var(--accent-active),var(--accent-hover));border-radius:var(--radius-pill);height:10px}.label{color:var(--muted);width:140px}</style></head><body><h1>Spacing rhythm</h1><div class="row"><span class="label">space-1 · 4px</span><div class="bar" style="width:var(--space-1)"></div></div><div class="row"><span class="label">space-2 · 8px</span><div class="bar" style="width:var(--space-2)"></div></div><div class="row"><span class="label">space-4 · 16px</span><div class="bar" style="width:var(--space-4)"></div></div><div class="row"><span class="label">space-6 · 24px</span><div class="bar" style="width:var(--space-6)"></div></div><div class="row"><span class="label">space-8 · 32px</span><div class="bar" style="width:var(--space-8)"></div></div><div class="row"><span class="label">space-12 · 48px</span><div class="bar" style="width:var(--space-12)"></div></div></body></html>
