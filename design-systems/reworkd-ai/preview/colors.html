<!doctype html><html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../tokens.css" /><style>body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding:var(--space-8)}.grid{display:grid;gap:var(--space-4);grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.swatch{border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-5)}.tone{border-radius:var(--radius-sm);height:84px;margin-bottom:var(--space-3)}.label{color:var(--muted)}</style></head><body><h1>Reworkd colors</h1><div class="grid"><div class="swatch"><div class="tone" style="background:var(--bg)"></div><span class="label">Canvas</span></div><div class="swatch"><div class="tone" style="background:var(--surface)"></div><span class="label">Product paper</span></div><div class="swatch"><div class="tone" style="background:var(--surface-warm)"></div><span class="label">Data atmosphere</span></div><div class="swatch"><div class="tone" style="background:var(--accent)"></div><span class="label">Azure extraction</span></div><div class="swatch"><div class="tone" style="background:var(--fg)"></div><span class="label">Proof charcoal</span></div></div></body></html>
