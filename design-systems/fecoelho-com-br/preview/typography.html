<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fernanda Coelho — Typography</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      body { margin: 0; padding: var(--section-y-desktop); background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: var(--leading-body); }
      main { max-width: 760px; }
      h1 { margin: 0 0 var(--space-6); font-family: var(--font-display); font-size: var(--text-4xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-display); }
      .sample { margin: 0 0 var(--space-4); color: var(--fg-2); }
      .xl { font-size: var(--text-xl); font-weight: 600; } .lg { font-size: var(--text-lg); font-weight: 500; }
      .base { font-size: var(--text-base); color: var(--muted); } .sm { font-size: var(--text-sm); color: var(--meta); }
      .xs { font-size: var(--text-xs); color: var(--meta); }
    </style>
  </head>
  <body>
    <main>
      <h1>Fernanda Coelho</h1>
      <p class="sample xl">16.32px · Contact label · Inter 600</p>
      <p class="sample lg">16px · IA aplicada ao negócio · Inter 500</p>
      <p class="sample base">14.4px · Dados · Produtos · Inovação</p>
      <p class="sample sm">13.12px · Footer signature</p>
      <p class="sample xs">12.8px · Link metadata</p>
    </main>
  </body>
</html>
