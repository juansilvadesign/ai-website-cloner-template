<!doctype html><html lang="en"><head><meta charset="utf-8" /><title>Colors</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton\&family=Chakra+Petch:wght@500;700\&family=Press+Start+2P\&display=swap" /><link rel="stylesheet" href="../tokens.css" /><style>body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding:var(--space-8)}h1{font:400 var(--text-xl)/var(--leading-tight) var(--font-display);text-transform:uppercase;text-shadow:var(--elev-raised)}code{font:400 10px var(--font-mono);color:var(--fg-2)}.g{display:grid;gap:var(--space-4);grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.c{height:72px;border:1px solid var(--border-soft)}</style></head><body><h1>Colors</h1><div class="g"><div class="s"><div class="c" style="background:var(--bg)"></div><code>--bg</code></div><div class="s"><div class="c" style="background:var(--surface)"></div><code>--surface</code></div><div class="s"><div class="c" style="background:var(--surface-warm)"></div><code>--surface-warm</code></div><div class="s"><div class="c" style="background:var(--fg)"></div><code>--fg</code></div><div class="s"><div class="c" style="background:var(--fg-2)"></div><code>--fg-2</code></div><div class="s"><div class="c" style="background:var(--muted)"></div><code>--muted</code></div><div class="s"><div class="c" style="background:var(--border)"></div><code>--border</code></div><div class="s"><div class="c" style="background:var(--border-soft)"></div><code>--border-soft</code></div><div class="s"><div class="c" style="background:var(--accent)"></div><code>--accent</code></div><div class="s"><div class="c" style="background:var(--accent-on)"></div><code>--accent-on</code></div><div class="s"><div class="c" style="background:var(--success)"></div><code>--success</code></div><div class="s"><div class="c" style="background:var(--warn)"></div><code>--warn</code></div><div class="s"><div class="c" style="background:var(--danger)"></div><code>--danger</code></div></div></body></html>
