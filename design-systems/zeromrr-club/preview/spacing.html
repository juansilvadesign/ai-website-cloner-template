<!doctype html><html lang="en"><head><meta charset="utf-8" /><title>Spacing</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton\&family=Chakra+Petch:wght@500;700\&family=Press+Start+2P\&display=swap" /><link rel="stylesheet" href="../tokens.css" /><style>body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding:var(--space-8)}h1{font:400 var(--text-xl)/var(--leading-tight) var(--font-display);text-transform:uppercase;text-shadow:var(--elev-raised)}code{font:400 10px var(--font-mono);color:var(--fg-2)}.r{display:flex;gap:var(--space-4);align-items:center;margin-bottom:var(--space-3)}.b{height:16px;background:var(--accent)}</style></head><body><h1>Spacing</h1><div class="r"><div class="b" style="width:var(--space-1)"></div><code>--space-1</code></div><div class="r"><div class="b" style="width:var(--space-2)"></div><code>--space-2</code></div><div class="r"><div class="b" style="width:var(--space-3)"></div><code>--space-3</code></div><div class="r"><div class="b" style="width:var(--space-4)"></div><code>--space-4</code></div><div class="r"><div class="b" style="width:var(--space-5)"></div><code>--space-5</code></div><div class="r"><div class="b" style="width:var(--space-6)"></div><code>--space-6</code></div><div class="r"><div class="b" style="width:var(--space-8)"></div><code>--space-8</code></div><div class="r"><div class="b" style="width:var(--space-12)"></div><code>--space-12</code></div></body></html>
