<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../tokens.css" /><style>body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding:32px}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.swatch{border:1px solid var(--border);border-radius:var(--radius-md);padding:20px}.tone{border-radius:var(--radius-sm);height:84px;margin-bottom:12px}.label{color:var(--muted)}</style></head><body><h1>Reflect colors</h1><div class="grid"><div class="swatch"><div class="tone" style="background:var(--bg)"></div><span class="label">Canvas</span></div><div class="swatch"><div class="tone" style="background:var(--surface)"></div><span class="label">Glass surface</span></div><div class="swatch"><div class="tone" style="background:var(--surface-warm)"></div><span class="label">Warm inset</span></div><div class="swatch"><div class="tone" style="background:var(--accent)"></div><span class="label">Purple signal</span></div><div class="swatch"><div class="tone" style="background:var(--success)"></div><span class="label">AI success</span></div></div></body></html>
