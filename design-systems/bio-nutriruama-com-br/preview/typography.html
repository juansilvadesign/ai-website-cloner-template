<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" /><title>Ruama Cori — Typography</title><link rel="stylesheet" href="../tokens.css" /><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}.display{margin:0;font-family:var(--font-display);font-size:var(--text-4xl);font-weight:700;line-height:var(--leading-tight);letter-spacing:var(--tracking-display)}.scale{display:grid;gap:16px;margin-top:32px}.xs{font-size:var(--text-xs)}.sm{font-size:var(--text-sm)}.base{font-size:var(--text-base)}.lg{font-size:var(--text-lg)}.xl{font-size:var(--text-xl)}</style></head><body><p>Apaixone-se pelo</p><h1 class="display">processo</h1><p>de se tornar sua Melhor Versão!</p><div class="scale"><p class="xs">9px protocol caption</p><p class="sm">12px action label</p><p class="base">16px compact UI copy</p><p class="lg">20px mobile card title</p><p class="xl">25px hero support line</p></div></body></html>
