<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" /><title>Ruama Cori — Colors</title><link rel="stylesheet" href="../tokens.css" /><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.swatch{min-height:150px;padding:16px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);display:flex;align-items:end;font-weight:700}.wine{background:var(--fg);color:var(--accent-on)}.coral{background:var(--accent);color:var(--accent-on)}.green{background:var(--success);color:var(--fg-2)}.rose{background:var(--muted);color:var(--accent-on)}</style></head><body><h1>Color roles</h1><div class="grid"><div class="swatch">Canvas — #F8F8F8</div><div class="swatch wine">Ink — #280814</div><div class="swatch coral">Coral — #C64B4B</div><div class="swatch green">Protocol — #ABCC8E</div><div class="swatch rose">Muted rose — #C37D88</div><div class="swatch">Surface — #FFFFFF</div></div></body></html>
