<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" /><title>Ruama Cori — Spacing</title><link rel="stylesheet" href="../tokens.css" /><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}.row{display:flex;align-items:center;gap:16px;margin:16px 0}.bar{height:24px;border-radius:var(--radius-pill);background:var(--accent)}.s1{width:var(--space-1)}.s2{width:var(--space-2)}.s3{width:var(--space-3)}.s4{width:var(--space-4)}.s5{width:var(--space-5)}.s6{width:var(--space-6)}.s8{width:var(--space-8)}.s12{width:var(--space-12)}</style></head><body><h1>Spacing tiers</h1><div class="row"><span>4</span><div class="bar s1"></div></div><div class="row"><span>8</span><div class="bar s2"></div></div><div class="row"><span>12</span><div class="bar s3"></div></div><div class="row"><span>16</span><div class="bar s4"></div></div><div class="row"><span>20</span><div class="bar s5"></div></div><div class="row"><span>24</span><div class="bar s6"></div></div><div class="row"><span>32</span><div class="bar s8"></div></div><div class="row"><span>48</span><div class="bar s12"></div></div></body></html>
