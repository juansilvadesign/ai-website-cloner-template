<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Medium spacing</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:48px;background:var(--surface);color:var(--fg);font-family:var(--font-body)}.sample{display:grid;gap:var(--space-8);max-width:700px}.row{display:flex;align-items:center;gap:16px}.bar{height:16px;background:var(--fg)}.s1{width:var(--space-1)}.s2{width:var(--space-2)}.s3{width:var(--space-3)}.s4{width:var(--space-4)}.s5{width:var(--space-5)}.s6{width:var(--space-6)}.s8{width:var(--space-8)}.s12{width:var(--space-12)}</style></head><body><main class="sample"><h1>Base rhythm</h1><div class="row"><span>4</span><i class="bar s1"></i></div><div class="row"><span>8</span><i class="bar s2"></i></div><div class="row"><span>12</span><i class="bar s3"></i></div><div class="row"><span>16</span><i class="bar s4"></i></div><div class="row"><span>20</span><i class="bar s5"></i></div><div class="row"><span>24</span><i class="bar s6"></i></div><div class="row"><span>32</span><i class="bar s8"></i></div><div class="row"><span>48</span><i class="bar s12"></i></div></main></body></html>
