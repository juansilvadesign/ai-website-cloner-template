<!-- Bridge & Human token-wired fixture. Import the emitted token contract first. -->
<link rel="stylesheet" href="./tokens.css" />

<style>
  .bh-fixture {
    max-width: var(--container-max);
    padding: var(--space-3);
    margin: 0 auto;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
  }

  .bh-fixture__header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    min-height: var(--section-y-desktop);
    border-bottom: 1px solid var(--border-soft);
  }

  .bh-fixture__wordmark {
    margin: 0;
    font-size: var(--text-base);
    font-weight: 500;
    letter-spacing: var(--tracking-display);
  }

  .bh-fixture__meta {
    margin: 0;
    color: var(--meta);
    font-family: var(--font-mono);
    font-size: var(--text-sm);
  }

  .bh-fixture__arrows {
    display: flex;
    justify-content: end;
    gap: var(--space-2);
  }

  .bh-fixture__icon {
    border: 0;
    padding: var(--space-1);
    background: transparent;
    color: var(--fg);
    font-size: var(--text-xl);
  }

  .bh-fixture__progress {
    height: 1px;
    background: var(--border-soft);
  }

  .bh-fixture__progress::before {
    display: block;
    width: 28%;
    height: 100%;
    background: var(--fg);
    content: "";
  }

  .bh-fixture__story {
    display: grid;
    gap: var(--space-6);
    padding-block: var(--space-8);
  }

  .bh-fixture__eyebrow {
    margin: 0 0 var(--space-2);
    font-size: var(--text-lg);
    font-weight: 500;
    line-height: var(--leading-body);
  }

  .bh-fixture__title {
    max-width: 9ch;
    margin: 0;
    font-family: var(--font-display);
    font-size: var(--text-4xl);
    font-weight: 400;
    letter-spacing: var(--tracking-display);
    line-height: var(--leading-tight);
  }

  .bh-fixture__copy {
    max-width: 48ch;
    color: var(--fg-2);
    font-size: var(--text-sm);
    line-height: var(--leading-body);
  }

  .bh-fixture__chip {
    display: inline-block;
    padding: var(--space-1) var(--space-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
  }

  .bh-fixture__actions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-3);
  }

  .bh-fixture__button {
    display: inline-flex;
    min-height: 56px;
    align-items: center;
    justify-content: center;
    padding: var(--space-5) var(--space-6);
    border-radius: var(--radius-md);
    background: var(--accent);
    color: var(--accent-on);
    font-size: var(--text-lg);
    font-weight: 500;
    text-decoration: none;
    transition: background-color var(--motion-fast) var(--ease-standard);
  }

  .bh-fixture__button:hover { background: var(--accent-hover); }

  .bh-fixture__button:focus-visible,
  .bh-fixture__icon:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }

  .bh-fixture__media {
    min-height: 320px;
    border-radius: var(--radius-lg);
    background: var(--surface-warm);
    box-shadow: var(--elev-flat);
  }

  @media (min-width: 810px) {
    .bh-fixture__story { grid-template-columns: 1fr 1fr; }
  }
</style>

<main class="bh-fixture">
  <header class="bh-fixture__header">
    <p class="bh-fixture__meta">Saturday, Aug 29</p>
    <p class="bh-fixture__wordmark">Bridge &amp; Human</p>
    <div class="bh-fixture__arrows">
      <button class="bh-fixture__icon" type="button" aria-label="Previous story">←</button>
      <button class="bh-fixture__icon" type="button" aria-label="Next story">→</button>
    </div>
  </header>
  <div class="bh-fixture__progress"></div>
  <section class="bh-fixture__story">
    <div>
      <p class="bh-fixture__eyebrow">We Craft</p>
      <h1 class="bh-fixture__title">Design That Connects.</h1>
      <p class="bh-fixture__copy">Purposeful, narrative-driven digital experiences.</p>
      <p class="bh-fixture__chip">© 2026</p>
      <div class="bh-fixture__actions"><a class="bh-fixture__button" href="#">Start A Conversation</a></div>
    </div>
    <div class="bh-fixture__media"></div>
  </section>
</main>
