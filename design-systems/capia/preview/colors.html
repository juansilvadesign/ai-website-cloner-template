<!doctype html><html lang="pt-BR"><head><meta charset="utf-8" /><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800\&family=Mr+Dafoe\&display=swap" /><link rel="stylesheet" href="../tokens.css" /><style>body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding:var(--space-8)}h1{font:800 var(--text-xl)/var(--leading-tight) var(--font-display);letter-spacing:var(--tracking-display)}.grid{display:grid;gap:var(--space-4);grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.swatch{background:var(--surface);border-radius:var(--radius-md);padding:var(--space-4)}.tone{border-radius:var(--radius-sm);font-size:22px;height:96px;margin-bottom:var(--space-3)}.label{display:block;font-weight:700}.hex{color:var(--muted);font-size:var(--text-sm)}</style></head><body><h1>Capiá — cores</h1><div class="grid"><div class="swatch"><div class="tone" style="background:var(--bg);box-shadow:var(--elev-ring)"></div><span class="label">Pão (canvas)</span><span class="hex">--bg #f5eddf</span></div><div class="swatch"><div class="tone" style="background:var(--surface);box-shadow:var(--elev-ring)"></div><span class="label">Branco (surface)</span><span class="hex">--surface #fffaf1</span></div><div class="swatch"><div class="tone" style="background:var(--fg)"></div><span class="label">Carvão (ink)</span><span class="hex">--fg #16130f</span></div><div class="swatch"><div class="tone" style="background:var(--fg-2)"></div><span class="label">Carvão 2</span><span class="hex">--fg-2 #231e19</span></div><div class="swatch"><div class="tone" style="background:var(--accent)"></div><span class="label">Cheddar (accent)</span><span class="hex">--accent #f8b21b</span></div><div class="swatch"><div class="tone" style="background:var(--danger)"></div><span class="label">Tomate</span><span class="hex">--danger #dc4126</span></div><div class="swatch"><div class="tone" style="background:var(--success)"></div><span class="label">Mate</span><span class="hex">--success #3f8040</span></div><div class="swatch"><div class="tone" style="background:var(--fg);box-shadow:inset 0 0 0 999px var(--border-soft)"></div><span class="label">Hairline on carvão</span><span class="hex">--border-soft</span></div></div></body></html>
