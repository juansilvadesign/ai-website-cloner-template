<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hello Parul colors</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-4)}.swatch{min-height:120px;padding:var(--space-5);border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--surface)}.ink{background:var(--fg);color:var(--accent-on)}.accent{background:var(--accent);color:var(--accent-on)}.warm{background:var(--surface-warm)}</style></head><body><h1>Color roles</h1><div class="grid"><div class="swatch">Canvas<br>--bg</div><div class="swatch warm">Warm surface<br>--surface-warm</div><div class="swatch ink">Ink<br>--fg</div><div class="swatch accent">Action<br>--accent</div></div></body></html>
