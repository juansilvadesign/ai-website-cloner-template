<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hello Parul spacing</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}.row{display:flex;align-items:end;gap:var(--space-4);margin-block:var(--space-6)}.unit{display:grid;gap:var(--space-2);font:var(--text-sm) "Space Mono",monospace}.bar{width:48px;background:var(--accent);border-radius:var(--radius-sm)}</style></head><body><h1>Spacing rhythm</h1><div class="row"><div class="unit"><div class="bar" style="height:var(--space-1)"></div>1</div><div class="unit"><div class="bar" style="height:var(--space-3)"></div>8</div><div class="unit"><div class="bar" style="height:var(--space-5)"></div>16</div><div class="unit"><div class="bar" style="height:var(--space-6)"></div>22</div><div class="unit"><div class="bar" style="height:var(--space-8)"></div>32</div><div class="unit"><div class="bar" style="height:var(--space-12)"></div>64</div></div></body></html>
