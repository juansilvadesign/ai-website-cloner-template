<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Spaceship colors</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.swatch{min-height:150px;padding:16px;border-radius:var(--radius-md);display:flex;align-items:end;font-weight:700}.bg{background:var(--bg);box-shadow:var(--elev-ring)}.surface{background:var(--surface)}.warm{background:var(--surface-warm)}.accent{background:var(--accent);color:var(--accent-on)}.muted{background:var(--muted);color:var(--bg)}.success{background:var(--success)}.warn{background:var(--warn);color:var(--bg)}.danger{background:var(--danger)}</style></head><body><h1>Spaceship color roles</h1><div class="grid"><div class="swatch bg">Canvas</div><div class="swatch surface">Base surface</div><div class="swatch warm">Raised surface</div><div class="swatch accent">Conversion</div><div class="swatch muted">Secondary text</div><div class="swatch success">Success</div><div class="swatch warn">Warning</div><div class="swatch danger">Danger</div></div></body></html>
