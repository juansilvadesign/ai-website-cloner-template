<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Spaceship spacing</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:48px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}.row{display:flex;align-items:center;gap:16px;margin:18px 0}.bar{height:20px;border-radius:var(--radius-pill);background:var(--accent)}.one{width:var(--space-1)}.two{width:var(--space-2)}.three{width:var(--space-3)}.four{width:var(--space-4)}.five{width:var(--space-5)}.six{width:var(--space-6)}.eight{width:var(--space-8)}.twelve{width:var(--space-12)}</style></head><body><h1>Spaceship spacing rhythm</h1><div class="row"><span>4</span><div class="bar one"></div></div><div class="row"><span>8</span><div class="bar two"></div></div><div class="row"><span>12</span><div class="bar three"></div></div><div class="row"><span>16</span><div class="bar four"></div></div><div class="row"><span>20</span><div class="bar five"></div></div><div class="row"><span>24</span><div class="bar six"></div></div><div class="row"><span>32</span><div class="bar eight"></div></div><div class="row"><span>48</span><div class="bar twelve"></div></div></body></html>
