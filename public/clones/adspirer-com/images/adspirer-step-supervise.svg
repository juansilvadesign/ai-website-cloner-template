<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none" role="img" aria-label="Supervise with receipts: a campaign waits paused for your approval under a hard spend cap, and every change is logged.">
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
    .card{fill:#fff;stroke:#e4e7ec;stroke-width:1.6}
    .k{fill:#667085;font:600 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
    .v{fill:#0f1728;font:700 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
    @keyframes fillcap{0%{width:0}100%{width:132px}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
    .cap{animation:fillcap 1.8s ease-out}
    .await{animation:blink 1.8s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.cap{animation:none}.await{animation:none}}
  </style>

  <!-- 1 · approval card (text left, actions right) -->
  <g transform="translate(30 26)">
    <rect class="card" width="460" height="120" rx="18"/>
    <g class="await" transform="translate(24 24)">
      <rect width="136" height="24" rx="12" fill="#fff7ee" stroke="#ffd8a8" stroke-width="1.5"/>
      <g transform="translate(13 6)" stroke="#ff8400" stroke-width="2" stroke-linecap="round"><path d="M2 0v12M8 0v12"/></g>
      <text x="30" y="16" fill="#b26a00" font-size="11" font-weight="700" letter-spacing=".3">AWAITING YOU</text>
    </g>
    <text class="v" x="24" y="72" font-size="15">Summer Sale · PMax</text>
    <text class="k" x="24" y="95">Paused — nothing has spent yet</text>
    <!-- actions, stacked on the right -->
    <rect x="300" y="30" width="138" height="34" rx="10" fill="#1067fe"/>
    <text x="369" y="51" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Approve &amp; launch</text>
    <rect x="300" y="74" width="138" height="34" rx="10" class="card"/>
    <text x="369" y="95" text-anchor="middle" class="k">Decline</text>
  </g>

  <!-- 2 · hard spend cap -->
  <g transform="translate(30 164)">
    <rect class="card" width="460" height="86" rx="18"/>
    <text class="k" x="24" y="34">Hard spend cap</text>
    <text class="v" x="24" y="64" font-size="22" font-weight="800">$5,000<tspan class="k" font-size="13" font-weight="600"> / mo</tspan></text>
    <rect x="232" y="32" width="204" height="12" rx="6" fill="#eef1f5"/>
    <rect class="cap" x="232" y="32" width="132" height="12" rx="6" fill="#1067fe"/>
    <g transform="translate(232 52)" stroke="#12a150" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M9 1 2 3.6v4.5c0 3.6 3 5.8 7 7.2 4-1.4 7-3.6 7-7.2V3.6z"/><path d="m6 8 2.4 2.4L13 6"/></g>
    <text class="k" x="258" y="65">Can't exceed your cap</text>
  </g>

  <!-- 3 · receipts / audit log -->
  <g transform="translate(30 264)">
    <text x="0" y="12" font-size="12" font-weight="700" letter-spacing=".3" fill="#0f1728">RECEIPTS · every change logged</text>
    <g transform="translate(0 26)"><rect class="card" width="460" height="32" rx="10" fill="#f8fafc"/><circle cx="20" cy="16" r="8" fill="#ecfdf3"/><path d="M16 16l3 3 5-6" stroke="#12a150" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="v" x="38" y="21">Created campaign — status PAUSED</text><text class="k" x="442" y="21" text-anchor="end">09:14</text></g>
    <g transform="translate(0 70)"><rect class="card" width="460" height="32" rx="10" fill="#f8fafc"/><circle cx="20" cy="16" r="8" fill="#fff7ee"/><g transform="translate(16 12)" stroke="#ff8400" stroke-width="1.8" stroke-linecap="round"><path d="M2 0v8M6 0v8"/></g><text class="v" x="38" y="21">Held for approval — awaiting your sign-off</text><text class="k" x="442" y="21" text-anchor="end">now</text></g>
  </g>
</svg>
